<mat-toolbar color="primary" class="header-toolbar">
  <button
    mat-icon-button
    [matMenuTriggerFor]="menuMain"
    class="mobile-menu-button"
    aria-label="Abrir menú"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <div class="logo-container">
    <img class="logo" src="images/sinfondo.png" alt="Logo Asada" />
  </div>

  <span class="spacer"></span>

  <nav class="nav-links">
    <a mat-button routerLink="/">Inicio</a>
    <a mat-button [routerLink]="['/acercade']">Nosotros</a>
    <a mat-button [routerLink]="['/servicios']">Servicios</a>
    <a mat-button [routerLink]="['/noticias']">Noticias</a>
    <a mat-button [routerLink]="['/consejos']">Consejos</a>
    <a mat-button [routerLink]="['/contacto']">Contacto</a>
  </nav>
</mat-toolbar>

<mat-menu #menuMain="matMenu">
  <button mat-menu-item routerLink="/">Inicio</button>
  <button mat-menu-item [routerLink]="['/acercade']">Nosotros</button>
  <button mat-menu-item [routerLink]="['/servicios']">Servicios</button>
  <button mat-menu-item [routerLink]="['/noticias']">Noticias</button>
  <button mat-menu-item [routerLink]="['/consejos']">Consejos</button>
  <button mat-menu-item [routerLink]="['/contacto']">Contacto</button>
</mat-menu>
